name: aikigrade
description: "A helpful app for Aikido practitioners to track their progress, learn techniques, and stay motivated."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  csv: ^8.0.0
  flutter_markdown: ^0.7.7
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  logger: ^2.0.2+1
  flutter_rating_bar: ^4.0.1
  fl_chart: ^1.2.0
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  test: ^1.31.0
  mocktail: ^1.0.0
  path_provider_platform_interface: ^2.1.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
      - family: Katana
        fonts:
          - asset: assets/fonts/Katanf.ttf
          - asset: assets/fonts/Katanfi.ttf
            style: italic
  uses-material-design: true
  assets:
      - assets/images/
      - assets/csv/
      - assets/markdowns/
      - assets/markdowns/techniques/
      - assets/config.json
